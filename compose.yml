# Usage on a host with Docker:
#   mkdir -p data/in && cp .env.example .env   # fill in the VLM endpoint (optional: teacher-less without)
#   docker compose up -d                       # web app on port 8000 (bind it to a private interface below)
#   docker compose run --rm vobsub-to-srt /data/in/movie.idx      # CLI; SRT appears in data/out/
# Both share ./data (glyph memory etc.). Watchtower pulls new :latest images and replaces running containers.
services:
  web:
    image: ghcr.io/n0ctu/vobsub-to-srt:latest
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment:
      VTS_DATA: /data
      VTS_TRUST_PROXY: "1"          # behind a reverse proxy that sets X-Forwarded-For
    ports:
      - "127.0.0.1:8787:8000"       # change 127.0.0.1 to the private IP your reverse proxy reaches
    volumes:
      - ./data:/data
    tmpfs:                          # belt and braces: the app itself keeps job data in memory
      - /tmp
    labels:
      - com.centurylinklabs.watchtower.enable=true

  vobsub-to-srt:
    profiles: ["cli"]
    image: ghcr.io/n0ctu/vobsub-to-srt:latest
    env_file: .env
    volumes:
      - ./data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600
