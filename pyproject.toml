[project]
name = "vobsub-to-srt"
version = "0.1.0"
description = "VobSub (.idx/.sub) to SRT: self-learning glyph OCR with a vision LLM as teacher"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "n0ctu" }]
requires-python = ">=3.12"
keywords = ["vobsub", "srt", "subtitles", "ocr", "idx", "sub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.13",
    "spylls>=0.1.7",
    "wordfreq>=3.1.1",
]

[project.urls]
Homepage = "https://github.com/n0ctu/vobsub-to-srt"
Repository = "https://github.com/n0ctu/vobsub-to-srt"
Issues = "https://github.com/n0ctu/vobsub-to-srt/issues"

[project.scripts]
vobsub-to-srt = "vobsub_to_srt.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vobsub_to_srt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
