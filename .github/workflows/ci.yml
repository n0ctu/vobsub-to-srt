name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install fonts used by the tests
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core fonts-liberation
      - run: uv sync --locked
      - run: uv run pytest -q
